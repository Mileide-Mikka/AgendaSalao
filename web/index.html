<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Belle SALÃO — agenda e gestão do salão" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Belle Salão & Barbearia</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('belle-ui-preferences');
          var p = raw ? JSON.parse(raw) : {};
          var theme = p.theme === 'light' ? 'light' : 'dark';
          var density = p.density === 'compact' ? 'compact' : 'comfortable';
          var sidebar = p.sidebar === 'rail' ? 'rail' : 'expanded';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.density = density;
          document.documentElement.dataset.sidebar = sidebar;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
